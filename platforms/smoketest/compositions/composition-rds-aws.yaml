apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: rds-aws-smoketest
  labels:
    app.kubernetes.io/managed-by: kubernova
    kubernova.io/platform: smoketest
    kubernova.io/service: rds
    kubernova.io/provider: aws
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: database.smoketest.kubernova.io/v1alpha1
    kind: XRds
  mode: Pipeline
  pipeline:
  - step: render
    functionRef:
      name: fn-rds-database
    input:
      apiVersion: fn-rds-database.kubernova.io/v1alpha1
      kind: Input
      spec:
        platform: smoketest
        service: rds
        provider: aws
  - step: auto-ready
    functionRef:
      name: function-auto-ready
