apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: lambda-aws-smoketest
  labels:
    app.kubernetes.io/managed-by: kubernova
    kubernova.io/platform: smoketest
    kubernova.io/service: lambda
    kubernova.io/provider: aws
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: compute.smoketest.kubernova.io/v1alpha1
    kind: XLambda
  mode: Pipeline
  pipeline:
  - step: render
    functionRef:
      name: fn-aws-lambda
    input:
      apiVersion: fn-aws-lambda.kubernova.io/v1alpha1
      kind: Input
      spec:
        platform: smoketest
        service: lambda
        provider: aws
  - step: auto-ready
    functionRef:
      name: function-auto-ready
