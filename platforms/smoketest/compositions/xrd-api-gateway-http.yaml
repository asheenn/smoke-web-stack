apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xapigatewayhttps.compute.smoketest.kubernova.io
  labels:
    app.kubernetes.io/managed-by: kubernova
    kubernova.io/platform: smoketest
    kubernova.io/service: api-gateway-http
spec:
  group: compute.smoketest.kubernova.io
  names:
    kind: XApiGatewayHttp
    plural: xapigatewayhttps
  claimNames:
    kind: ApiGatewayHttp
    plural: apigatewayhttps
  defaultCompositionRef:
    name: api-gateway-http-aws-smoketest
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              parameters:
                type: object
                properties:
                  region:
                    type: string
                    description: AWS region
                    default: us-east-1
                  apiName:
                    type: string
                    description: AWS-side API name. Defaults to the diagram node label.
                  protocolType:
                    type: string
                    description: Protocol type. HTTP API (v2) is the modern, cheaper,
                      faster choice. WEBSOCKET reserved for a future flavor.
                    enum:
                    - HTTP
                    default: HTTP
                  cors:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Enable CORS preflight handling at the API Gateway
                          level.
                        default: false
                      allowOrigins:
                        type: array
                        description: Allowed origins (e.g. ['https://app.example.com']).
                        items:
                          type: string
                      allowMethods:
                        type: array
                        description: Allowed HTTP methods. Defaults to ['*'] when
                          CORS is on.
                        items:
                          type: string
                      allowHeaders:
                        type: array
                        description: Allowed request headers. Defaults to ['*'] when
                          CORS is on.
                        items:
                          type: string
                  accessLogs:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        description: Enable CloudWatch access logs for each request.
                        default: false
                      retentionDays:
                        type: integer
                        description: How long to keep access logs (1..3653 days).
                        minimum: 1
                        maximum: 3653
                        default: 7
                      kmsEncryption:
                        type: boolean
                        description: Encrypt logs with a customer-managed KMS key
                          (requires the kms conditional dep). Defaults to AWS-managed
                          encryption.
                        default: false
                  auth:
                    type: object
                    properties:
                      type:
                        type: string
                        description: "Auth mode. v1 only honors NONE. JWT/IAM reserved\
                          \ for P7 follow-up \u2014 see docs/serverless-http-api-flavor-design.md."
                        enum:
                        - NONE
                        - JWT
                        - IAM
                        default: NONE
                  integrationTarget:
                    type: object
                    properties:
                      payloadFormatVersion:
                        type: string
                        description: "API Gateway \u2192 Lambda event format. 2.0\
                          \ is the modern default; 1.0 only for legacy Lambdas built\
                          \ for REST API."
                        enum:
                        - '1.0'
                        - '2.0'
                        default: '2.0'
                      timeoutMs:
                        type: integer
                        description: Integration timeout in milliseconds (50..30000).
                        minimum: 50
                        maximum: 30000
                        default: 30000
                  tags:
                    type: object
                    description: Free-form AWS tags applied to all sub-resources.
                    additionalProperties: true
                  deletionPolicy:
                    type: string
                    description: Crossplane deletion policy.
                    enum:
                    - Delete
                    - Orphan
                    default: Delete
                  refs:
                    type: object
                    description: References to dependent claim names, populated by
                      the canvas. Keys are ref_keys from required_deps (e.g. network,
                      kms).
                    additionalProperties:
                      type: string
                required:
                - region
              compositionRef:
                type: object
                additionalProperties: true
              compositionSelector:
                type: object
                additionalProperties: true
              compositionRevisionRef:
                type: object
                additionalProperties: true
              compositionUpdatePolicy:
                type: string
              writeConnectionSecretToRef:
                type: object
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
            required:
            - parameters
          status:
            type: object
            additionalProperties: true
