apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: network-aws-smoketest
  labels:
    app.kubernetes.io/managed-by: kubernova
    kubernova.io/platform: smoketest
    kubernova.io/service: network
    kubernova.io/provider: aws
    provider: aws
spec:
  compositeTypeRef:
    apiVersion: network.smoketest.kubernova.io/v1alpha1
    kind: XNetwork
  mode: Pipeline
  pipeline:
  - step: render
    functionRef:
      name: fn-aws-network
    input:
      apiVersion: fn-aws-network.kubernova.io/v1alpha1
      kind: Input
      spec:
        platform: smoketest
        service: network
        provider: aws
  - step: auto-ready
    functionRef:
      name: function-auto-ready
