apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smoketest-compositions
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: kubernova
    kubernova.io/platform: smoketest
    kubernova.io/scope: compositions
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/asheenn/smoke-web-stack.git
    targetRevision: main
    path: platforms/smoketest/compositions
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: crossplane-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
