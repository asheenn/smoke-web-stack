apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: supervisor
  namespace: argocd
  labels:
    kubernova.io/tenant: f2aa1ded-64e9-44a0-afb6-312c54d2c117
    kubernova.io/platform: smoketest
    kubernova.io/environment: production
    kubernova.io/package: supervisor
    kubernova.io/package-version: latest
spec:
  project: f2aa1ded-64e9-44a0-afb6-312c54d2c117
  destination:
    server: https://kubernetes.default.svc
    namespace: kn-obs-f2aa1ded-64e9-44a0-afb6-312c54d2c117-production
  sources:
  - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.153.0
    helm:
      releaseName: supervisor
      valueFiles:
      - $values/platforms/smoketest/production/smoke-1781072025/observability/values/supervisor.values.yaml
  - repoURL: https://github.com/asheenn/smoke-web-stack.git
    targetRevision: HEAD
    ref: values
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
