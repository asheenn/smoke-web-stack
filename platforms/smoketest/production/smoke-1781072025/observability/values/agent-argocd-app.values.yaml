# Generated by Kubernova — do not edit by hand
# package: agent-argocd-app@1.0.0, resource: agent-argocd-app
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

fullnameOverride: agent-argocd-app-agent-argocd-app

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    memory: "256Mi"

podLabels:
  kubernova.io/role: agent
  kubernova.io/agent-kind: agent-argocd-app
  kubernova.io/tenant: "f2aa1ded-64e9-44a0-afb6-312c54d2c117"
  kubernova.io/environment: "production"
  kubernova.io/platform: "smoketest"

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: [events, namespaces, services, endpoints]
      verbs: [get, list, watch]
    - apiGroups: [argoproj.io]
      resources: [applications, applicationsets, appprojects]
      verbs: [get, list, watch]

config:
  receivers:
    prometheus/argocd:
      config:
        scrape_configs:
          - job_name: argocd-metrics
            scrape_interval: 30s
            metrics_path: /metrics
            static_configs:
              - targets: ["argocd-metrics.argocd.svc:8082"]
            metric_relabel_configs:
              - source_labels: [__name__]
                regex: "argocd_app_(info|sync_total|health_status|sync_status).*"
                action: keep

    k8sobjects/argocd_apps:
      auth_type: serviceAccount
      objects:
        - name: applications
          group: argoproj.io
          mode: pull
          interval: 15s
          label_selector: "kubernova.io/platform=smoketest"

    k8s_events/argocd:
      auth_type: serviceAccount
      namespaces: [argocd]

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 128

    resource/kubernova:
      attributes:
        - { key: kubenova.tenant,             value: "f2aa1ded-64e9-44a0-afb6-312c54d2c117",          action: insert }
        - { key: kubenova.platform,           value: "smoketest",        action: insert }
        - { key: kubenova.environment,        value: "production",     action: insert }
        - { key: kubenova.env_name,          value: "smoke-1781072025",          action: insert }
        - { key: kubenova.component.kind,     value: "argocd-app",             action: insert }
        - { key: kubenova.component.provider, value: "kubernetes",             action: insert }
        - { key: kubenova.agent.kind,         value: "agent-argocd-app",       action: insert }
        - { key: kubenova.agent.version,      value: "1.0.0", action: insert }

    transform/argocd_to_semconv:
      metric_statements:
        - context: datapoint
          statements:
            - set(attributes["kubenova.event.kind"], "argocd_sync") where metric.name == "argocd_app_sync_total"
        # The metric-rename has to live in the `metric` context because
        # the upstream `transform` processor (>= v0.150) makes
        # `metric.name` read-only from the `datapoint` context.  Trying
        # to write to it there fails config validation with::
        #
        #   segment "name" from path "datapoint.name" is not a valid path
        #
        # which crash-loops the agent-argocd-app pod on every release.
        # See the OTel collector release notes for the OTTL context
        # tightening.  Rename always (not just when health_status=Healthy)
        # because the per-datapoint conditional needs the datapoint
        # context which can't rewrite metric.name.
        - context: metric
          statements:
            - set(name, "kubenova_component_health") where name == "argocd_app_info"
      log_statements:
        - context: log
          statements:
            - set(attributes["kubenova.event.kind"], "argocd_sync") where IsString(body) and IsMatch(body, "(?i)Sync|Healthy|OutOfSync|Degraded")
            - set(attributes["kubenova.component.name"], attributes["object"]["metadata"]["name"]) where attributes["object"] != nil
            # k8sobjects receiver emits the polled Application as body Map.
            # Mirror semconv attrs from body keys (the older attributes
            # ["object"] path is empty for this receiver version).
            - set(attributes["kubenova.component.name"], body["metadata"]["name"]) where IsMap(body) and body["metadata"] != nil and body["metadata"]["name"] != nil
            - set(attributes["k8s.object.kind"], body["kind"]) where IsMap(body) and body["kind"] != nil
            - set(attributes["k8s.object.name"], body["metadata"]["name"]) where IsMap(body) and body["metadata"] != nil and body["metadata"]["name"] != nil
            - set(attributes["status.conditions"], body["status"]["conditions"]) where IsMap(body) and body["status"] != nil and body["status"]["conditions"] != nil
            # Replace Map body with a useful string before VictoriaLogs
            # export — otherwise VL auto-fills _msg with the
            # "missing _msg field" warning, which the dashboard picks up
            # as the chip caption. See agent-aws-vpc for the full
            # rationale (reproduced on app-tst4).
            - set(body, Concat(["argocd ", body["kind"], "/", body["metadata"]["name"]], "")) where IsMap(body) and body["kind"] != nil and body["metadata"] != nil and body["metadata"]["name"] != nil

    batch:
      send_batch_size: 4096
      timeout: 5s

  exporters:
    otlp/supervisor:
      endpoint: otelcol-supervisor.kn-obs-f2aa1ded-64e9-44a0-afb6-312c54d2c117-production.svc:4317
      tls:
        insecure: true
      retry_on_failure:
        enabled: true

  service:
    pipelines:
      metrics:
        receivers: [prometheus/argocd]
        processors: [memory_limiter, resource/kubernova, transform/argocd_to_semconv, batch]
        exporters: [otlp/supervisor]
      logs:
        receivers: [k8sobjects/argocd_apps, k8s_events/argocd]
        processors: [memory_limiter, resource/kubernova, transform/argocd_to_semconv, batch]
        exporters: [otlp/supervisor]
