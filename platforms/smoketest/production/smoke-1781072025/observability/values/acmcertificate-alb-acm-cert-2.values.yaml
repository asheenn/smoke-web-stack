# Generated by Kubernova — do not edit by hand
# package: agent-crossplane-claims@1.0.0, resource: acmcertificate-alb-acm-cert-2
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

fullnameOverride: agent-crossplane-claims-acmcertificate-alb-acm-cert-2

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    memory: "256Mi"

podLabels:
  kubernova.io/role: agent
  kubernova.io/agent-kind: agent-crossplane-claims
  kubernova.io/tenant: "f2aa1ded-64e9-44a0-afb6-312c54d2c117"
  kubernova.io/environment: "production"
  kubernova.io/platform: "smoketest"

# Crossplane XR/Claim CRs live across many groups (database.kubernova.io,
# compute.kubernova.io, etc.) so we grant cluster-wide read on a wildcard
# group set we know our canvas_generator targets. Read-only — agent never
# mutates the cluster.
clusterRole:
  create: true
  rules:
    - apiGroups: ["", events.k8s.io]
      resources: [events, namespaces]
      verbs: [get, list, watch]
    - apiGroups: [apiextensions.crossplane.io, pkg.crossplane.io]
      resources: ["*"]
      verbs: [get, list, watch]
    # Per-platform XRD groups (canvas_generator emits these as
    # `<group>.<platform>.kubernova.io`) plus the legacy generic groups
    # for backwards compat with platforms still on the multi-cloud layout.
    #
    # MUST stay in sync with the API-group set in observability/registry/
    # renderer.py:_CLAIM_CRD_BY_KIND. When canvas_generator added cdn /
    # cache / messaging / ml groups (for cloudfront, elasticache,
    # kinesis/sqs/msk, sagemakerendpoint) the watch list rendered fine
    # but the cluster-role didn't grant access — agent crashlooped with
    # `cannot list resource ... forbidden` and the dashboard silently
    # dropped those Kinds from the Provisioning Pipeline. The Vestifix
    # auto-publish has no way to add cluster-roles, so anything that
    # CAN be reached by an XRD lives here.
    - apiGroups:
        - database.smoketest.kubernova.io
        - compute.smoketest.kubernova.io
        - network.smoketest.kubernova.io
        - storage.smoketest.kubernova.io
        - security.smoketest.kubernova.io
        - addons.smoketest.kubernova.io
        - cdn.smoketest.kubernova.io
        - cache.smoketest.kubernova.io
        - messaging.smoketest.kubernova.io
        - ml.smoketest.kubernova.io
        - database.kubernova.io
        - compute.kubernova.io
        - network.kubernova.io
        - storage.kubernova.io
        - security.kubernova.io
        - addons.kubernova.io
        - cdn.kubernova.io
        - cache.kubernova.io
        - messaging.kubernova.io
        - ml.kubernova.io
      resources: ["*"]
      verbs: [get, list, watch]

config:
  receivers:
    # k8sobjects: pulls every Claim object on the schedule the registry
    # configured. The collector emits one log entry per object on each
    # pull, with the object payload in attributes — we mine status.conditions
    # Watch the per-platform XRD groups emitted by the canvas generator.
    # Each platform's claim CRDs live under `<group>.<platform>.kubernova.io`
    # (see backend/xrd_generator.py — group derived from `platform_name`).
    #
    # The k8sobjects receiver hard-fails the whole pipeline if ANY listed
    # resource isn't installed in the cluster — so we render exactly the
    # claim Kinds present on this platform. `claim_watch_list` is built
    # by observability/registry/renderer.py from
    # platform.spec.observability.claimKinds (set by kubenova-backend's
    # _build_observability_artifacts on every publish). Falls back to
    # platform.resources componentKinds when claimKinds is absent.
    #
    # When the list is empty (a platform with no claims, just a bare
    # supervisor + argocd agent) we fall through with a single safe-noop
    # entry. The Crossplane Event watcher below picks up signal too.
    k8sobjects/crossplane_claims:
      auth_type: serviceAccount
      objects:
        - name: networks
          group: network.smoketest.kubernova.io
          mode: pull
          interval: 15s
        - name: applicationloadbalancers
          group: network.smoketest.kubernova.io
          mode: pull
          interval: 15s
        - name: ekses
          group: compute.smoketest.kubernova.io
          mode: pull
          interval: 15s
        - name: rdses
          group: database.smoketest.kubernova.io
          mode: pull
          interval: 15s
        - name: acmcertificates
          group: security.smoketest.kubernova.io
          mode: pull
          interval: 15s
        - name: kmskeys
          group: security.smoketest.kubernova.io
          mode: pull
          interval: 15s

    # Crossplane writes events on its own Event objects when XRs / Claims
    # transition or reconcile. Capturing them gives us a per-event audit
    # trail in addition to the polled snapshots above.
    k8s_events/crossplane:
      auth_type: serviceAccount
      namespaces: []  # all

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 128

    resource/kubernova:
      attributes:
        - { key: kubenova.tenant,             value: "f2aa1ded-64e9-44a0-afb6-312c54d2c117",          action: insert }
        - { key: kubenova.platform,           value: "smoketest",        action: insert }
        - { key: kubenova.environment,        value: "production",     action: insert }
        - { key: kubenova.env_name,          value: "smoke-1781072025",          action: insert }
        - { key: kubenova.component.kind,     value: "crossplane-claim",      action: insert }
        - { key: kubenova.component.provider, value: "kubernetes",            action: insert }
        - { key: kubenova.agent.kind,         value: "agent-crossplane-claims", action: insert }
        - { key: kubenova.agent.version,      value: "1.0.0", action: insert }

    transform/claim_to_semconv:
      log_statements:
        - context: log
          statements:
            # ── Old k8sobjects receiver shape (pre-OTel 0.151):
            # polled object lives under attributes["object"].
            - set(attributes["kubenova.component.name"], attributes["object"]["metadata"]["name"]) where attributes["object"] != nil
            - set(attributes["kubenova.claim.kind"],     attributes["object"]["kind"])            where attributes["object"] != nil
            # Also override the generic "crossplane-claim" component.kind
            # (set by the resource processor) with the actual claim kind
            # — Eks, Rds, ApplicationLoadBalancer, etc. The dashboard
            # router groups rows by (component_kind, component_name); if
            # we leave component.kind generic, EVERY new agent-emitted
            # series creates a duplicate row alongside the published-seed
            # row (which carries the correct specific kind from vestifix-backend).
            - set(attributes["kubenova.component.kind"], attributes["object"]["kind"]) where attributes["object"] != nil and attributes["object"]["kind"] != nil
            # Inherit the platform label off the claim itself (in case the
            # cluster runs Applications for multiple platforms through the
            # same supervisor).
            - set(attributes["kubenova.platform"], attributes["object"]["metadata"]["labels"]["kubernova.io/platform"]) where attributes["object"]["metadata"]["labels"]["kubernova.io/platform"] != nil
            # Derive lifecycle phase from status.conditions.
            # ready (Ready=True) | provisioning (Composing/Creating) |
            # failed (ReconcileError/Error). Anything else stays unset →
            # treated as "pending" downstream.
            - set(attributes["kubenova.event.kind"], "lifecycle_transition") where attributes["object"] != nil
            - set(attributes["phase"], "ready")        where attributes["object"] != nil and IsMatch(attributes["object"]["status"]["conditions"][0]["type"], "(?i)Ready") and attributes["object"]["status"]["conditions"][0]["status"] == "True"
            - set(attributes["phase"], "provisioning") where attributes["object"] != nil and IsMatch(attributes["object"]["status"]["conditions"][0]["reason"], "(?i)Composing|Creating")
            - set(attributes["phase"], "failed")       where attributes["object"] != nil and IsMatch(attributes["object"]["status"]["conditions"][0]["reason"], "(?i)ReconcileError|Error")
            # k8s_events kind→reconcile_error mapping for the events stream.
            - set(attributes["kubenova.event.kind"], "reconcile_error") where attributes["k8s.event.type"] == "Warning"
            # ── New k8sobjects receiver shape (OTel 0.151+): the polled
            # claim is the log BODY (a Map). Mirror to semconv attrs.
            - set(attributes["kubenova.component.name"], body["metadata"]["name"]) where IsMap(body) and body["metadata"] != nil and body["metadata"]["name"] != nil
            - set(attributes["kubenova.claim.kind"], body["kind"]) where IsMap(body) and body["kind"] != nil
            # Override the generic "crossplane-claim" component.kind for
            # the body-Map shape too. See the older-shape comment above.
            - set(attributes["kubenova.component.kind"], body["kind"]) where IsMap(body) and body["kind"] != nil
            - set(attributes["k8s.object.kind"], body["kind"]) where IsMap(body) and body["kind"] != nil
            - set(attributes["k8s.object.name"], body["metadata"]["name"]) where IsMap(body) and body["metadata"] != nil and body["metadata"]["name"] != nil
            - set(attributes["status.conditions"], body["status"]["conditions"]) where IsMap(body) and body["status"] != nil and body["status"]["conditions"] != nil
            # CRITICAL: phase derivation for the new body-Map shape.
            # Without these the lifecycle_phase metric never advances
            # past the publish-time seed (Cloud Ready chip stays gray
            # forever even after the cloud resource is up).
            #
            # Crossplane writes TWO status conditions on a claim:
            #   [0] type=Synced  status=True  reason=ReconcileSuccess
            #   [1] type=Ready   status=True/False  reason=Available/Waiting
            #
            # We check BOTH positions because the order isn't guaranteed
            # — some claims emit Ready at [0], some at [1]. Checking
            # both covers either layout without needing OTTL iteration
            # (which OTel's transform processor doesn't support for
            # arrays).
            #
            # Order: ready (terminal) → failed (terminal) → provisioning
            # (transient). The last matching `set` wins so the priority
            # is encoded by ordering — terminal states beat transient.
            - set(attributes["kubenova.event.kind"], "lifecycle_transition") where IsMap(body) and body["kind"] != nil
            - set(attributes["phase"], "provisioning") where IsMap(body) and body["status"] != nil and body["status"]["conditions"] != nil and (IsMatch(body["status"]["conditions"][0]["reason"], "(?i)Composing|Creating|Waiting") or IsMatch(body["status"]["conditions"][1]["reason"], "(?i)Composing|Creating|Waiting"))
            - set(attributes["phase"], "failed")       where IsMap(body) and body["status"] != nil and body["status"]["conditions"] != nil and (IsMatch(body["status"]["conditions"][0]["reason"], "(?i)ReconcileError|Error") or IsMatch(body["status"]["conditions"][1]["reason"], "(?i)ReconcileError|Error"))
            - set(attributes["phase"], "ready")        where IsMap(body) and body["status"] != nil and body["status"]["conditions"] != nil and ((body["status"]["conditions"][0]["type"] == "Ready" and body["status"]["conditions"][0]["status"] == "True") or (body["status"]["conditions"][1]["type"] == "Ready" and body["status"]["conditions"][1]["status"] == "True"))
            # Replace Map body with a string before VL export so VL
            # doesn't auto-fill `_msg` with its "missing _msg field"
            # warning (which the dashboard then surfaces as the caption).
            - set(body, Concat(["claim ", body["kind"], "/", body["metadata"]["name"]], "")) where IsMap(body) and body["kind"] != nil and body["metadata"] != nil and body["metadata"]["name"] != nil

    # CRITICAL: convert delta-temporality sums → cumulative.
    #
    # The `count` connector in OTel contrib v0.151 emits Sum metrics
    # with **delta** aggregation temporality. Both VM's OTLP ingest
    # path and Prometheus' remote-write spec reject delta sums (VM
    # tallies them under
    # `vm_protoparser_rows_dropped_total{reason="unsupported_sum_aggregation"}`,
    # prw silently increments `failed_translations_total`).
    #
    # The `deltatocumulative` processor sits in front of the exporter
    # and converts each incoming delta point to a running cumulative
    # sum, which is what both backends want. The processor keeps an
    # in-memory tally per series; `max_stale` controls how long a
    # silent series is remembered before its state is dropped (so a
    # deleted claim's counter doesn't linger forever in the agent's
    # memory).
    #
    # 5m matches the dashboard's 2m rate window with headroom for
    # poll-interval jitter.
    deltatocumulative:
      max_stale: 5m

    batch:
      send_batch_size: 4096
      timeout: 5s

  # ── Log → Metric synthesizer ────────────────────────────────────────
  # Each polled-claim log entry that carries a derived `phase` attribute
  # increments the kubenova_component_lifecycle_phase counter. The
  # router uses rate-per-phase per (kubenova_component_kind,
  # kubenova_component_name) to derive the *current* phase — the phase
  # with the highest 2-minute rate wins.
  #
  # Cumulative semantics give us natural staleness handling: when a
  # claim is deleted its agent stops polling, the rate decays to 0
  # across all phases, and the dashboard drops it from the pipeline.
  # That cleans up the long-standing "ghost claims from prior tests"
  # problem.
  #
  # This is the single source of truth for the Cloud Ready chip color +
  # caption.  Per-resource agents (agent-aws-eks/rds/lambda/vpc) emit
  # MR-level data into VL only; they don't contribute to the
  # claim-level lifecycle metric (would conflict because MR names
  # differ from claim names).
  #
  # Implementation: switched from `signaltometrics` to the `count`
  # connector after empirically discovering signaltometrics in OTel
  # contrib v0.151 silently emits zero metrics in this configuration
  # (no clear root cause — even removing all conditions didn't make
  # it fire).  The `count` connector is older, simpler, and
  # battle-tested.  It counts each matching log entry as 1, which is
  # exactly what we need: each polled-claim log with a `phase`
  # attribute contributes one observation to the counter, broken
  # down by phase + identity attributes.
  connectors:
    count:
      logs:
        kubenova_component_lifecycle_phase:
          description: Lifecycle phase observation per kubenova claim
          # `count` increments the counter by 1 per matching log
          # entry; the resulting metric is monotonic per (kind, name,
          # phase) tuple.  The router uses rate-over-window per phase
          # to derive the *current* phase.
          attributes:
            - key: kubenova.component.kind
            - key: kubenova.component.name
            - key: kubenova.claim.kind
            - key: phase
            - key: kubenova.tenant
            - key: kubenova.platform
            - key: kubenova.environment
            - key: kubenova.env_name
          # Same `log.attributes[...]` context-prefix requirement
          # (OTel 0.151+).  Drops the publish-time seed events that
          # don't carry a derived `phase`.
          conditions:
            - 'log.attributes["phase"] != nil and log.attributes["kubenova.component.name"] != nil'

  exporters:
    otlp/supervisor:
      endpoint: otelcol-supervisor.kn-obs-f2aa1ded-64e9-44a0-afb6-312c54d2c117-production.svc:4317
      tls:
        insecure: true
      retry_on_failure:
        enabled: true

  service:
    pipelines:
      logs:
        receivers: [k8sobjects/crossplane_claims, k8s_events/crossplane]
        processors: [memory_limiter, resource/kubernova, transform/claim_to_semconv, batch]
        # `count` is a connector — consumes the log stream AFTER
        # transform so it sees the derived `phase` attribute, then
        # feeds the metrics/derived pipeline.
        exporters: [otlp/supervisor, count]
      metrics/derived:
        receivers: [count]
        # `deltatocumulative` MUST sit between `count` (delta) and the
        # exporter (which feeds VM, which only accepts cumulative).
        processors: [memory_limiter, deltatocumulative, batch]
        exporters: [otlp/supervisor]
