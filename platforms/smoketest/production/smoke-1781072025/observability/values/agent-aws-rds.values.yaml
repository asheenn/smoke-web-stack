            # VictoriaLogs — otherwise VL auto-fills `_msg` with its
            # "missing _msg field" warning, which the dashboard then
            # surfaces as the chip caption. See agent-aws-vpc for the
            # full rationale (app-tst4 reproduced this on first publish).
            - set(body, Concat(["lifecycle ", body["kind"], "/", body["metadata"]["name"]], "")) where IsMap(body) and body["kind"] != nil and body["metadata"] != nil and body["metadata"]["name"] != nil

    batch:
      send_batch_size: 4096
      timeout: 5s

