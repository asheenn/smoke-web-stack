        - name: clusters
          group: rds.aws.upbound.io
          mode: pull
          interval: 15s
          # No `label_selector` — composition functions don't add a
          # `kubernova.io/platform` label to composed MRs. Per-claim
          # attribution happens downstream in the obs router via
          # name-prefix matching against the known claim list.
        - name: subnetgroups
          group: rds.aws.upbound.io
          mode: pull
          interval: 15s
          # No `label_selector` — composition functions don't add a
          # `kubernova.io/platform` label to composed MRs. Per-claim
          # attribution happens downstream in the obs router via
          # name-prefix matching against the known claim list.
    k8s_events/rds:
      auth_type: serviceAccount
      namespaces: ["", default, crossplane-system]

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 128

    resource/kubernova:
      attributes:
        - { key: kubenova.tenant,             value: "f2aa1ded-64e9-44a0-afb6-312c54d2c117",          action: insert }
        - { key: kubenova.platform,           value: "smoketest",        action: insert }
        - { key: kubenova.environment,        value: "production",     action: insert }
        - { key: kubenova.env_name,          value: "smoke-1781072025",          action: insert }
        - { key: kubenova.component.kind,     value: "rds",                    action: insert }
        - { key: kubenova.component.provider, value: "aws",                    action: insert }
        - { key: kubenova.agent.kind,         value: "agent-aws-rds",          action: insert }
        - { key: kubenova.agent.version,      value: "1.0.0", action: insert }

    transform/lifecycle_to_metrics:
      log_statements:
        - context: log
          statements:
            # See agent-aws-vpc for the full rationale. k8sobjects emits
            # the polled object as the log BODY (Map), not as flat
            # attributes — so we read via `body["kind"]` etc. and copy
            # to standard semconv attributes the router queries.
            - set(attributes["kubenova.event.kind"], "lifecycle_transition") where IsString(body) and IsMatch(body, "(?i)Ready|Synced|Available|Failed|Pending")
            - set(attributes["kubenova.event.kind"], "lifecycle_transition") where IsMap(body) and body["kind"] != nil
            - set(attributes["k8s.object.kind"], body["kind"]) where IsMap(body) and body["kind"] != nil
            - set(attributes["k8s.object.api_version"], body["apiVersion"]) where IsMap(body) and body["apiVersion"] != nil
            - set(attributes["k8s.object.name"], body["metadata"]["name"]) where IsMap(body) and body["metadata"] != nil and body["metadata"]["name"] != nil
            - set(attributes["status.conditions"], body["status"]["conditions"]) where IsMap(body) and body["status"] != nil and body["status"]["conditions"] != nil
