# Generated by Kubernova — do not edit by hand
# package: supervisor@1.0.0, resource: supervisor
mode: deployment
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

fullnameOverride: otelcol-supervisor

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    memory: "1Gi"

podLabels:
  kubernova.io/role: supervisor
  kubernova.io/tenant: "f2aa1ded-64e9-44a0-afb6-312c54d2c117"
  kubernova.io/environment: "production"
  kubernova.io/release: "supervisor"

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    memory_limiter:
      check_interval: 1s
      limit_mib: 512

    attributes/enforce_semconv:
      actions:
        - { key: kubenova.environment, value: "production", action: upsert }
        # tenant + platform are stamped by agents; we re-assert as a guard
        - { key: kubenova.tenant,      value: "f2aa1ded-64e9-44a0-afb6-312c54d2c117",      action: insert }
        - { key: kubenova.platform,    value: "smoketest",    action: insert }

    resource/strip_high_card:
      attributes:
        - { key: k8s.uid, action: delete }
        - { key: k8s.pod.uid, action: delete }
        - { key: k8s.replicaset.uid, action: delete }

    groupbyattrs/platform:
      keys: [kubenova.tenant, kubenova.platform]

    transform/rollup_components:
      # Copy resource-level kubenova attributes onto each datapoint AND
      # mirror them under PromQL-friendly underscore keys. VM's OTLP-native
      # ingest preserves OTel-style dotted attribute names (`kubenova.platform`),
      # which PromQL can match only with the curly-brace escape form. Mirroring
      # to underscore form (`kubenova_platform`) lets existing
      # `rate(kubenova_component_lifecycle_phase{kubenova_platform="..."}[2m])`
      # queries from the dashboard router (and Grafana, alertmanager, etc.)
      # keep working unchanged.
      metric_statements:
        - context: datapoint
          statements:
            # Datapoint-attribute copy (so each sample carries the labels)
            - set(attributes["kubenova.platform"],     resource.attributes["kubenova.platform"])     where resource.attributes["kubenova.platform"]     != nil
            - set(attributes["kubenova.tenant"],       resource.attributes["kubenova.tenant"])       where resource.attributes["kubenova.tenant"]       != nil
            - set(attributes["kubenova.environment"],  resource.attributes["kubenova.environment"])  where resource.attributes["kubenova.environment"]  != nil
            - set(attributes["kubenova.env_name"],     resource.attributes["kubenova.env_name"])     where resource.attributes["kubenova.env_name"]     != nil
            # Underscore mirrors — datapoint-level attributes get aliased
            # so PromQL `{kubenova_platform="..."}` works without the dot
            # escape. Use the datapoint attribute we just set above so that
            # connector-emitted metrics (which only carry datapoint
            # attributes, no resource attributes) are also covered.
            - set(attributes["kubenova_platform"],     attributes["kubenova.platform"])     where attributes["kubenova.platform"]     != nil
            - set(attributes["kubenova_tenant"],       attributes["kubenova.tenant"])       where attributes["kubenova.tenant"]       != nil
            - set(attributes["kubenova_environment"],  attributes["kubenova.environment"])  where attributes["kubenova.environment"]  != nil
            - set(attributes["kubenova_env_name"],     attributes["kubenova.env_name"])     where attributes["kubenova.env_name"]     != nil
            - set(attributes["kubenova_component_kind"], attributes["kubenova.component.kind"]) where attributes["kubenova.component.kind"] != nil
            - set(attributes["kubenova_component_name"], attributes["kubenova.component.name"]) where attributes["kubenova.component.name"] != nil
            - set(attributes["kubenova_claim_kind"],     attributes["kubenova.claim.kind"])     where attributes["kubenova.claim.kind"]     != nil

    tail_sampling:
      decision_wait: 10s
      policies:
        - name: errors-keep-all
          type: status_code
          status_code: { status_codes: [ERROR] }
        - name: long-traces-keep-all
          type: latency
          latency: { threshold_ms: 60000 }
        - name: success-sample
          type: probabilistic
          probabilistic: { sampling_percentage: 10 }

    batch:
      send_batch_size: 8192
      timeout: 5s

  exporters:
    # The supervisor forwards metrics/logs/traces to the host observability
    # backend (VictoriaMetrics + VictoriaLogs + VictoriaTraces). The backend
    # namespace is configurable via `config.obsBackendNamespace` so the
    # supervisor can target whichever namespace the host stack is deployed
    # under — default `kubernova-observability`.
    #
    # **Metrics path: OTLP-native, not prometheusremotewrite.**
    # We previously used `prometheusremotewrite/vm` and watched it silently
    # drop ~30% of incoming series (every count-connector counter the
    # agents emit, including `kubenova_component_lifecycle_phase`). The
    # exporter's `prometheusremotewrite_failed_translations_total` counter
    # ticked up to 924 across a few hours of run; vmselect saw only the
    # prom-scrape self-metrics. The translation layer in the v0.151 prw
    # exporter is finicky about Sum temporality / target_info / attribute
    # sanitization, and chasing those failures one by one is a losing
    # game. VictoriaMetrics cluster supports OTel-native ingest at
    # `/insert/<tenant>/opentelemetry/v1/metrics`, which bypasses prw
    # translation entirely — metric points arrive as-is. Use that.
    otlphttp/vm:
      metrics_endpoint: "http://vm-victoria-metrics-cluster-vminsert.kubernova-observability.svc:8480/insert/0/opentelemetry/v1/metrics"
      encoding: proto
      tls:
        insecure: true
    otlphttp/vl:
      logs_endpoint: "http://vl-victoria-logs-single-server.kubernova-observability.svc:9428/insert/opentelemetry/v1/logs"
      encoding: proto
      tls:
        insecure: true
    otlphttp/vt:
      # VictoriaTraces single-server chart names the service `vt-vt-single-server`
      # (the chart's `nameOverride: vt` collapses the long chart name). Earlier
      # iteration used `vt-victoria-traces-single-server` which the supervisor
      # then couldn't resolve, dropping every trace push. Keep this in sync if
      # the host stack ever changes traces backends.
      traces_endpoint: "http://vt-vt-single-server.kubernova-observability.svc:10428/insert/opentelemetry/v1/traces"
      encoding: proto
      tls:
        insecure: true

  service:
    pipelines:
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, attributes/enforce_semconv, transform/rollup_components, resource/strip_high_card, batch]
        exporters: [otlphttp/vm]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, attributes/enforce_semconv, resource/strip_high_card, batch]
        exporters: [otlphttp/vl]
      traces:
        receivers: [otlp]
        processors: [memory_limiter, attributes/enforce_semconv, tail_sampling, resource/strip_high_card, batch]
        exporters: [otlphttp/vt]
